<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<!--
  S. Sparham Electrical - REVIEW card, 1200x630.
  Centred layout per the link-card skill: logo -> "How Did We Do?" -> 5 gold
  stars -> one-line ask -> domain.

  REBUILD:  cd site/og && bash render.sh review-card.html ../assets/og-review.jpg

  --virtual-time-budget in render.sh is mandatory. Without it Chrome captures
  before the webfonts arrive and you get a silent Arial fallback that looks
  nothing like the site.

  A REPLACEMENT MUST GET A NEW FILENAME. WhatsApp and Facebook cache the
  preview per URL, so overwriting og-review.jpg in place keeps serving the old
  thumbnail for weeks.

  Fonts are the SITE's fonts, Archivo + Manrope, not the template's Barlow +
  Inter. The whole point of the card is that it looks like this business.

  Photo is g9, the finished black kitchen: window light on the left, warm wood
  worktop and floor, obviously a finished room. g19 and g11 were tried first -
  g19 went muddy under the wash and g11 is a flat grey building site, which is
  the wrong message entirely for a card that asks how the job went. The wash is
  lighter than the template default (.50 not .62) so the warmth survives.
-->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Manrope:wght@500;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}

  .card{position:relative;width:1200px;height:630px;overflow:hidden;
        font-family:'Manrope',sans-serif;background:#101215}

  /* grayscale is dropped to .12 from the template's .35: the warmth of the
     wood and the lit downlights is the whole reason this photo was chosen. */
  .photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
         object-position:center 46%;filter:grayscale(.06) saturate(1.10) brightness(1.06)}
  .wash{position:absolute;inset:0;background:#101215;opacity:.50}
  .vig{position:absolute;inset:0;
       background:radial-gradient(ellipse 72% 66% at 50% 46%,
                  rgba(0,0,0,.10) 0%, rgba(0,0,0,.58) 100%)}

  .inner{position:relative;z-index:2;height:100%;
         display:flex;flex-direction:column;align-items:center;justify-content:center;
         text-align:center;padding:40px 70px}

  .logo{height:118px;width:auto;display:block;margin-bottom:22px;
        filter:drop-shadow(0 6px 22px rgba(0,0,0,.55))}

  h1{font-family:'Archivo',sans-serif;font-weight:900;color:#fff;
     font-size:60px;line-height:1.04;letter-spacing:-.02em;
     text-shadow:0 3px 18px rgba(0,0,0,.55)}

  /* U+2605 via font fallback - never hand-drawn */
  .stars{margin-top:16px;font-size:40px;letter-spacing:.16em;color:#F5B417;
         text-shadow:0 3px 14px rgba(0,0,0,.55)}

  .sub{margin-top:16px;font-size:27px;font-weight:600;color:#3FCEF6;
       line-height:1.35;max-width:900px;text-shadow:0 2px 12px rgba(0,0,0,.55)}

  /* nothing critical in the bottom ~40px - Facebook draws its own UI there */
  .foot{margin-top:22px;font-size:22px;font-weight:600;color:#E7EDF2;
        letter-spacing:.01em;text-shadow:0 2px 10px rgba(0,0,0,.55)}
  .foot .dot{opacity:.5;margin:0 12px}
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="../assets/g9.jpg" alt="">
    <div class="wash"></div>
    <div class="vig"></div>

    <div class="inner">
      <img class="logo" src="../assets/logo-hero.webp" alt="">

      <h1>How Did We Do?</h1>

      <div class="stars">&#9733; &#9733; &#9733; &#9733; &#9733;</div>

      <p class="sub">A quick review takes about thirty seconds &mdash; and it really helps.</p>

      <div class="foot">ssparhamelectrical.co.uk<span class="dot">&middot;</span>07557 448945</div>
    </div>
  </div>
</body>
</html>
